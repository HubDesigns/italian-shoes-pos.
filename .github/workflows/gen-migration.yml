# TEMPORARY: generates the baseline migration from prisma/schema.prisma and commits it to the branch.
# (The Prisma engine download is blocked in the authoring sandbox, but works here.)
name: Generate baseline migration
on:
  push:
    branches: ["feature/stage-1-foundation"]
    paths: [".github/workflows/gen-migration.yml"]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/italian_shoes?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/italian_shoes?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx prisma validate
      - name: Generate and commit the migration
        run: |
          DIR=prisma/migrations/20261115120000_init
          mkdir -p "$DIR"
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > "$DIR/migration.sql"
          printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          wc -l "$DIR/migration.sql"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "Add baseline database migration (generated from schema)"
          git push
